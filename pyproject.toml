[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-input-fuzzer"
version = "0.1.0"
description = "Property-based automated fuzzer finding edge-case crashes in agent tool handlers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
tool-input-fuzzer = "tool_input_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_input_fuzzer*"]
